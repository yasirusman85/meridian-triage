[[entry]]
id = 1
type = "story"
title = "Every tenant gets an acknowledgement"
description = "Outbox port and simulated adapter storing OutboundMessage rows; fixed acknowledgement template with job reference sent on intake; the gas safety message replaces it when a gas rule fired; outbound messages listed on the job."
