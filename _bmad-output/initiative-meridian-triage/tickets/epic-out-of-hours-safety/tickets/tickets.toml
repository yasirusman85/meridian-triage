type = "story"
title = "Emergencies reach Rachel, then the backup"
description = "Background worker every minute: notify Rachel at once for emergency jobs, the backup after 30 minutes unacknowledged, escalation-failed after a further 30 minutes; staff acknowledge from the queue; every step an event; notifications panel in the UI."
